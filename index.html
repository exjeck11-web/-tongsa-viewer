                        <div>• <strong>(나) 석탄:</strong> 1990년 약 27% → 2023년 약 26% (최대 생산국: 중국)</div>
                        <div>• 천연가스(약 23%), 수력 및 신·재생 에너지(약 15%), 원자력(약 4%)</div>
                    </div>
                `,
                choices: [
                    "① (가)의 세계 최대 생산국은 중국이다.",
                    "② (나) 소비량은 1990년이 2010년보다 많다.",
                    "③ (가)는 (나)보다 국제 이동량이 많다.",
                    "④ (나)는 (가)보다 수송용 연료로 사용되는 비중이 높다.",
                    "⑤ (가) 소비량에 대한 수력 및 신·재생 에너지 소비량의 비율은 1990년에 비해 2023년에 낮아졌다."
                ],
                answer: 3,
                explanation: "③ 석유(가)는 생산지와 소비지가 불일치하여 석탄(나)보다 국제 이동량이 훨씬 많습니다."
            }
        ];

        // 상태 관리
        let currentUnit = "all";
        let currentExam = "all";
        let searchQuery = "";
        let selectedQuestionId = questionsData[0].id;
        let isQuizMode = true;
        let userAnswers = {}; // { questionId: selectedChoiceNumber(1~5) }

        // 초기 카운트 계산 및 표시
        function updateUnitCounts() {
            document.getElementById("count-all").textContent = questionsData.length;
            document.getElementById("count-1").textContent = questionsData.filter(q => q.unitCode === "1단원").length;
            document.getElementById("count-3").textContent = questionsData.filter(q => q.unitCode === "3단원").length;
            document.getElementById("count-6").textContent = questionsData.filter(q => q.unitCode === "6단원").length;
            document.getElementById("count-7").textContent = questionsData.filter(q => q.unitCode === "7단원").length;
        }

        // 필터링된 문항 목록 반환
        function getFilteredQuestions() {
            return questionsData.filter(q => {
                const matchUnit = currentUnit === "all" || q.unitCode === currentUnit;
                const matchExam = currentExam === "all" || q.exam === currentExam;
                const query = searchQuery.trim().toLowerCase();
                const matchSearch = !query || 
                    q.topic.toLowerCase().includes(query) ||
                    q.subUnit.toLowerCase().includes(query) ||
                    q.stem.toLowerCase().includes(query) ||
                    q.exam.toLowerCase().includes(query) ||
                    q.boxContent.toLowerCase().includes(query);
                return matchUnit && matchExam && matchSearch;
            });
        }

        // 단원 배지 색상
        function getUnitBadgeStyle(unitCode) {
            switch(unitCode) {
                case "1단원": return "bg-amber-100 text-amber-800 border-amber-200";
                case "3단원": return "bg-emerald-100 text-emerald-800 border-emerald-200";
                case "6단원": return "bg-purple-100 text-purple-800 border-purple-200";
                case "7단원": return "bg-blue-100 text-blue-800 border-blue-200";
                default: return "bg-slate-100 text-slate-800 border-slate-200";
            }
        }

        // 왼쪽 문항 리스트 렌더링
        function renderQuestionList() {
            const listContainer = document.getElementById("questionListContainer");
            const filtered = getFilteredQuestions();
            document.getElementById("filteredCountText").textContent = `총 ${filtered.length}문항`;

            if (filtered.length === 0) {
                listContainer.innerHTML = `
                    <div class="p-10 text-center text-slate-400">
                        <i class="fa-regular fa-folder-open text-3xl mb-2"></i>
                        <p class="text-sm">조건에 일치하는 문항이 없습니다.</p>
                    </div>
                `;
                return;
            }

            listContainer.innerHTML = filtered.map(q => {
                const isSelected = q.id === selectedQuestionId;
                const answered = userAnswers[q.id];
                let statusIcon = "";
                if (answered) {
                    statusIcon = answered === q.answer 
                        ? `<span class="text-emerald-600 text-xs font-bold"><i class="fa-solid fa-circle-check"></i> 정답</span>`
                        : `<span class="text-red-500 text-xs font-bold"><i class="fa-solid fa-circle-xmark"></i> 오답</span>`;
                }

                return `
                    <div onclick="selectQuestion('${q.id}')" 
                         class="p-3.5 cursor-pointer transition hover:bg-blue-50/60 ${isSelected ? 'bg-blue-50 border-l-4 border-blue-600' : 'border-l-4 border-transparent'}">
                        <div class="flex items-center justify-between gap-2 mb-1">
                            <div class="flex items-center gap-1.5 flex-wrap">
                                <span class="text-[11px] font-bold px-2 py-0.5 rounded border ${getUnitBadgeStyle(q.unitCode)}">${q.unitCode}</span>
                                <span class="text-xs font-semibold text-slate-600">${q.exam}</span>
                                <span class="text-xs font-bold text-slate-800 bg-slate-100 px-1.5 py-0.5 rounded">${q.number}</span>
                            </div>
                            ${statusIcon}
                        </div>
                        <h3 class="text-sm font-bold text-slate-900 leading-snug mb-1">${q.topic}</h3>
                        <p class="text-[11px] text-slate-500 truncate">${q.subUnit}</p>
                    </div>
                `;
            }).join("");
        }

        // 오른쪽 실제 시험지 스타일 문항 상세 렌더링
        function renderQuestionViewer() {
            const viewer = document.getElementById("questionViewerContainer");
            const q = questionsData.find(item => item.id === selectedQuestionId);

            if (!q) {
                viewer.innerHTML = `<div class="m-auto text-slate-400 text-sm">문항을 선택해 주세요.</div>`;
                return;
            }

            const userChoice = userAnswers[q.id];
            const showAnswer = !isQuizMode || userChoice !== undefined;

            // 이전/다음 문항 네비게이션
            const filtered = getFilteredQuestions();
            const currentIndex = filtered.findIndex(item => item.id === q.id);
            const prevItem = currentIndex > 0 ? filtered[currentIndex - 1] : null;
            const nextItem = currentIndex >= 0 && currentIndex < filtered.length - 1 ? filtered[currentIndex + 1] : null;

            viewer.innerHTML = `
                <div class="max-w-2xl mx-auto w-full space-y-4">
                    <!-- 상단 메타 및 네비게이션 -->
                    <div class="flex flex-wrap items-center justify-between gap-2 bg-white px-4 py-2.5 rounded-xl shadow-sm border border-slate-200">
                        <div class="flex items-center gap-2 text-xs">
                            <span class="font-bold px-2 py-0.5 rounded border ${getUnitBadgeStyle(q.unitCode)}">${q.unitName}</span>
                            <span class="text-slate-400">|</span>
                            <span class="font-semibold text-slate-600">${q.pageRef}</span>
                        </div>
                        <div class="flex items-center gap-1.5">
                            <button onclick="${prevItem ? `selectQuestion('${prevItem.id}')` : ''}" ${!prevItem ? 'disabled' : ''} 
                                class="px-2.5 py-1 rounded border text-xs font-semibold ${prevItem ? 'bg-white hover:bg-slate-100 text-slate-700 border-slate-300' : 'bg-slate-50 text-slate-300 border-slate-200 cursor-not-allowed'}">
                                <i class="fa-solid fa-chevron-left"></i> 이전
                            </button>
                            <button onclick="${nextItem ? `selectQuestion('${nextItem.id}')` : ''}" ${!nextItem ? 'disabled' : ''} 
                                class="px-2.5 py-1 rounded border text-xs font-semibold ${nextItem ? 'bg-white hover:bg-slate-100 text-slate-700 border-slate-300' : 'bg-slate-50 text-slate-300 border-slate-200 cursor-not-allowed'}">
                                다음 <i class="fa-solid fa-chevron-right"></i>
                            </button>
                        </div>
                    </div>

                    <!-- 실제 모의고사 시험지 카드 -->
                    <div class="bg-white rounded-xl shadow-sm border-2 border-slate-800 overflow-hidden">
                        <!-- 시험지 상단 헤더 -->
                        <div class="exam-header-tag px-5 py-2.5 flex justify-between items-center text-xs text-slate-600">
                            <span class="font-bold tracking-wider">제4교시 사회탐구 영역 (통합사회)</span>
                            <span class="font-semibold bg-white px-2 py-0.5 rounded border border-slate-300">${q.exam} · 배점 [${q.points}]</span>
                        </div>

                        <div class="p-5 md:p-6 space-y-5">
                            <!-- 발문 -->
                            <div class="text-base font-bold text-slate-900 leading-relaxed">
                                <span class="text-blue-700 mr-1">${q.number.replace('번', '')}.</span>
                                ${q.stem} [${q.points}]
                            </div>

                            <!-- 제시문 / 도표 / 지도 박스 -->
                            <div class="exam-box p-4 rounded-sm text-slate-800 leading-relaxed">
                                ${q.boxContent}
                            </div>

                            <!-- <보기> 박스 (있는 경우만 렌더링) -->
                            ${q.bogi ? `
                                <div class="border border-slate-700 p-4 pt-5 relative bg-white mt-4">
                                    <span class="absolute -top-2.5 left-1/2 transform -translate-x-1/2 bg-white px-3 text-xs font-bold tracking-widest text-slate-800">&lt; 보 기 &gt;</span>
                                    <div class="text-sm leading-relaxed text-slate-800">
                                        ${q.bogi}
                                    </div>
                                </div>
                            ` : ''}

                            <!-- 5지선다 선지 -->
                            <div class="space-y-2 pt-1">
                                ${q.choices.map((choice, idx) => {
                                    const choiceNum = idx + 1;
                                    let btnClass = "border-slate-200 bg-white text-slate-800";
                                    if (showAnswer) {
                                        if (choiceNum === q.answer) {
                                            btnClass = "choice-correct";
                                        } else if (choiceNum === userChoice && userChoice !== q.answer) {
                                            btnClass = "choice-wrong";
                                        }
                                    } else if (choiceNum === userChoice) {
                                        btnClass = "choice-selected";
                                    }

                                    return `
                                        <button onclick="handleChoiceClick('${q.id}', ${choiceNum})" 
                                            class="choice-btn w-full text-left px-4 py-2.5 rounded-lg border text-sm flex items-center justify-between ${btnClass}">
                                            <span>${choice}</span>
                                            ${showAnswer && choiceNum === q.answer ? '<span class="text-xs font-bold bg-emerald-600 text-white px-2 py-0.5 rounded">정답</span>' : ''}
                                            ${showAnswer && choiceNum === userChoice && userChoice !== q.answer ? '<span class="text-xs font-bold bg-red-500 text-white px-2 py-0.5 rounded">선택한 오답</span>' : ''}
                                        </button>
                                    `;
                                }).join("")}
                            </div>

                            <!-- 정답 및 해설 영역 -->
                            ${showAnswer ? `
                                <div class="mt-4 p-4 rounded-xl bg-emerald-50/80 border border-emerald-200 text-sm space-y-1.5">
                                    <div class="flex items-center justify-between">
                                        <span class="font-bold text-emerald-900 flex items-center gap-1.5">
                                            <i class="fa-solid fa-lightbulb text-amber-500"></i>
                                            정답: ${q.answer}번 (${q.choices[q.answer - 1]})
                                        </span>
                                        ${userChoice !== undefined ? `
                                            <button onclick="resetQuestionAnswer('${q.id}')" class="text-xs text-slate-500 hover:text-slate-800 underline">다시 풀기</button>
                                        ` : ''}
                                    </div>
                                    <p class="text-slate-700 leading-relaxed pt-1">${q.explanation}</p>
                                </div>
                            ` : `
                                <div class="text-right">
                                    <button onclick="revealAnswer('${q.id}')" class="text-xs font-semibold text-blue-600 hover:text-blue-800 underline">
                                        정답 및 해설 바로 보기
                                    </button>
                                </div>
                            `}
                        </div>
                    </div>
                </div>
            `;
        }

        // 이벤트 핸들러 함수들
        function selectQuestion(id) {
            selectedQuestionId = id;
            renderQuestionList();
            renderQuestionViewer();
        }

        function handleChoiceClick(questionId, choiceNum) {
            userAnswers[questionId] = choiceNum;
            renderQuestionList();
            renderQuestionViewer();
        }

        function resetQuestionAnswer(questionId) {
            delete userAnswers[questionId];
            renderQuestionList();
            renderQuestionViewer();
        }

        function revealAnswer(questionId) {
            const q = questionsData.find(item => item.id === questionId);
            if (q) {
                userAnswers[questionId] = q.answer;
                renderQuestionList();
                renderQuestionViewer();
            }
        }

        // 필터 및 검색 이벤트 바인딩
        document.querySelectorAll(".unit-tab").forEach(tab => {
            tab.addEventListener("click", () => {
                document.querySelectorAll(".unit-tab").forEach(t => {
                    t.classList.remove("active", "bg-slate-800", "text-white");
                    t.classList.add("bg-slate-100", "text-slate-600");
                });
                tab.classList.add("active", "bg-slate-800", "text-white");
                tab.classList.remove("bg-slate-100", "text-slate-600");

                currentUnit = tab.dataset.unit;
                const filtered = getFilteredQuestions();
                if (filtered.length > 0 && !filtered.some(q => q.id === selectedQuestionId)) {
                    selectedQuestionId = filtered[0].id;
                }
                renderQuestionList();
                renderQuestionViewer();
            });
        });

        document.getElementById("examSelect").addEventListener("change", (e) => {
            currentExam = e.target.value;
            const filtered = getFilteredQuestions();
            if (filtered.length > 0 && !filtered.some(q => q.id === selectedQuestionId)) {
                selectedQuestionId = filtered[0].id;
            }
            renderQuestionList();
            renderQuestionViewer();
        });

        document.getElementById("searchInput").addEventListener("input", (e) => {
            searchQuery = e.target.value;
            const filtered = getFilteredQuestions();
            if (filtered.length > 0 && !filtered.some(q => q.id === selectedQuestionId)) {
                selectedQuestionId = filtered[0].id;
            }
            renderQuestionList();
            renderQuestionViewer();
        });

        document.getElementById("quizModeToggle").addEventListener("click", function() {
            isQuizMode = !isQuizMode;
            if (isQuizMode) {
                this.classList.remove("bg-emerald-600", "hover:bg-emerald-500");
                this.classList.add("bg-blue-600", "hover:bg-blue-500");
                this.innerHTML = `<i class="fa-solid fa-pencil"></i><span>문제 풀이 모드: ON</span>`;
            } else {
                this.classList.remove("bg-blue-600", "hover:bg-blue-500");
                this.classList.add("bg-emerald-600", "hover:bg-emerald-500");
                this.innerHTML = `<i class="fa-solid fa-book-open"></i><span>정답·해설 바로보기: ON</span>`;
            }
            renderQuestionViewer();
        });

        // 초기 실행
        updateUnitCounts();
        renderQuestionList();
        renderQuestionViewer();
    </script>
</body>
</html>
